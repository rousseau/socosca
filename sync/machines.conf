# =============================================================================
# sync/machines.conf
# Modèle d'exemple pour la liste des machines distantes (rsync).
#
# Ce fichier est versionné et ne doit contenir AUCUNE IP, hostname ou
# identifiant réel (dépôt public). Créer une copie locale non versionnée
# 'machines.conf.local' à côté de ce fichier avec les vraies valeurs :
#   cp sync/machines.conf sync/machines.conf.local
# machines.conf.local est automatiquement préféré par push_code.sh /
# pull_results.sh s'il existe, et il est ignoré par git.
#
# Format : MACHINE_ID   USER@HOST                    REMOTE_EXP_DIR
# Les lignes commençant par # sont ignorées
# =============================================================================

# Exemple (à adapter dans machines.conf.local) :
#dgx-arm     user@100.x.x.x                /home/user/Exp/socosca
#linux-x86   user@100.x.x.x                /home/user/Exp/socosca
